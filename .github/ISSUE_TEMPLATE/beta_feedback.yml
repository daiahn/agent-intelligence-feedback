name: Beta Feedback
description: Share your experience with Agent Intelligence.  
title: "[Beta Feedback] "
labels: ["feedback"]
body:

  - type: markdown
    attributes:
      value: |
        Thanks for testing Agent Intelligence.
        Be honest, but also be aware that this feedback is public.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Mac
        - Linux

  - type: textarea
    id: first_impressions
    attributes:
      label: "How interested are you in an AI Health Check app? And how well are we delivering that??"
      
  - type: textarea
    id: missing
    attributes:
      label: "Is there a feature or insight it didn't provide that you really wanted?"

  - type: upload
    id: screenshots
    attributes:
      label: "Feel free to share screenshots if that's helpful to your feedback"
      description: "Drag and drop screenshots or files."
    validations:
      required: false
      accept: ".png,.jpg,.gif,.log,.txt,.zip"
    
  - type: textarea
    id: install_notes
    attributes:
      label: If install was difficult — what happened?
      placeholder: Leave blank if it was fine

  - type: checkboxes
    id: sources
    attributes:
      label: Which AI harnesses do you use that Agent Intelligence picked up?
      options:
        - label: Claude Cowork
        - label: Claude Code
        - label: ChatGPT
        - label: Codex
        - label: Gemini
        - label: Grok
        - label: Other (describe below)

  - type: dropdown
    id: ollama
    attributes:
      label: Did you have Ollama installed before testing?
      options:
        - "Yes, already had it"
        - "No — installed it for this"
        - "No — skipped / used basic mode"
        - "Not sure what Ollama is"

  - type: dropdown
    id: data_showed_up
    attributes:
      label: Did your AI sessions show up in the app?
      options:
        - "Yes, it seemed like most of them"
        - "Yes, but only some"
        - "No sessions appeared"
